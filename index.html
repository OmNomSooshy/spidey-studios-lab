<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#efe7d8">
  <meta name="description" content="A little creature with a home, a quiet nook, a bathroom, a kitchen with biscuits to steal, and somewhere above.">
  <title>Spider Byte · Sunburn VIII</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="playground" aria-label="Spider Byte's home">
    <canvas id="scene" aria-label="Spider Byte's connected home and the world above"></canvas>
    <button id="gravity-toggle" type="button" aria-pressed="false" aria-label="Let Byte feel your phone's gravity">
      <span class="gravity-arrow" aria-hidden="true">↓</span>
      <span id="gravity-label" class="sr-only">SCREEN OWNS DOWN</span>
    </button>
    <div id="gravity-status" role="status" aria-live="polite"></div>
    <button id="sound-toggle" type="button" aria-pressed="true" aria-label="Mute Byte's sounds">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z M17 8q5 4 0 8"/><path class="mute-line" d="M3 3l18 18"/></svg>
    </button>
    <section id="room-port" aria-label="Byte’s window into your room">
      <button id="room-window" type="button" aria-pressed="false">
        <video id="room-view" muted autoplay playsinline aria-hidden="true"></video>
        <span class="shutter" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="ear-ring" aria-hidden="true"></span>
      </button>
      <p id="room-caption"></p>
      <div id="room-fallback" hidden><button type="button" data-sense="camera">Light only</button><button type="button" data-sense="audio">Sound only</button></div>
    </section>
    <button id="crystal-wallet" type="button" aria-label="Open Byte's wardrobe"><svg viewBox="0 0 24 28" aria-hidden="true"><path d="m12 2 9 7-2 12-7 5-8-7L3 9z"/><path d="m12 2-2 11 11-4M3 9l7 4 2 13m-2-13 9 8"/></svg><span id="crystal-balance">0</span><svg class="wallet-bag" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6a3 3 0 0 1 5 2c0 2-3 2-3 4L3 18q9 4 18 0l-9-6"/></svg><small id="run-crystals" hidden></small></button>
    <dialog id="crystal-shop" aria-labelledby="shop-title">
      <div class="shop-window"><header><div><p class="shop-eyebrow">SMALL THINGS. BIG PERSONALITY.</p><h2 id="shop-title">Little treasures</h2></div><button id="shop-close" type="button" aria-label="Close collection">×</button></header>
      <div class="shop-wallet"><span>◇</span> <strong id="shop-balance">0</strong><span>crystals</span></div>
      <div class="wardrobe-stage"><canvas id="wardrobe-preview" width="240" height="250" aria-label="Preview of Byte’s selected outfit"></canvas></div>
      <nav id="treasure-tabs" aria-label="Treasure categories"></nav><div id="shop-items"></div><p id="shop-status" role="status" aria-live="polite"></p><footer>Climb for crystals. Keep the memories.<br>Every five in one climb brings a fragment home.</footer></div>
    </dialog>
    <div id="arrival" role="status"><span>Spider Byte</span><i></i><i></i><i></i></div>
  </main>
  <script src="room.js"></script>
  <script src="home.js"></script>
  <script src="crystal.js"></script>
  <script src="bathroom.js"></script>
  <script src="kitchen.js"></script>
  <script src="catalogue.js"></script>
  <script src="possessions.js"></script>
  <script src="economy.js"></script>
  <script src="game.js"></script>
</body>
</html>
