plugins {
    id 'com.android.application'
}

android {
    namespace 'studios.spidey.lightsaber.quest'
    compileSdk 34
    ndkVersion '27.0.12077973'
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'studios.spidey.lightsaber.quest'
        minSdk 29
        targetSdk 34
        versionCode 4
        versionName '0.5.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
                cppFlags '-std=c++17'
            }
        }
    }

    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }

    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' }
    }

    buildFeatures { prefab true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.36'
}
