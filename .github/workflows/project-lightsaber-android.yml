name: Project Lightsaber Android APK

on:
  push:
    branches: [work]
    paths:
      - "project-lightsaber/**"
      - ".github/workflows/project-lightsaber-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: project-lightsaber-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  debug-apk:
    name: Build and publish debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK command line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install pinned Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Build debug APK
        working-directory: project-lightsaber
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK contents and calculate checksum
        id: verify
        run: |
          apk="project-lightsaber/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          unzip -t "$apk"
          unzip -l "$apk" | grep -E 'lib/(arm64-v8a|x86_64)/liblightsaber\.so'
          sha256sum "$apk" | tee "$RUNNER_TEMP/apk.sha256"
          cp "$apk" "$RUNNER_TEMP/Project-Lightsaber-debug.apk"
          echo "sha256=$(cut -d ' ' -f 1 "$RUNNER_TEMP/apk.sha256")" >> "$GITHUB_OUTPUT"

      - name: Upload APK to this workflow run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Project-Lightsaber-debug-apk
          path: ${{ runner.temp }}/Project-Lightsaber-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable APK release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_SHA256: ${{ steps.verify.outputs.sha256 }}
        run: |
          tag="lightsaber-${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          printf 'Debug APK built from %s\nSHA-256: %s\n' "$GITHUB_SHA" "$APK_SHA256" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$tag" "$RUNNER_TEMP/Project-Lightsaber-debug.apk#Project-Lightsaber-debug.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Project Lightsaber debug APK ${GITHUB_RUN_NUMBER}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/Project-Lightsaber-debug.apk"
          {
            echo "## Project Lightsaber debug APK"
            echo ""
            echo "Download: ${download_url}"
            echo ""
            echo "SHA-256: \`${APK_SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"
