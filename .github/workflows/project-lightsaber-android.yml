name: Project Lightsaber Android APK

on:
  push:
    branches: [work]
    paths:
      - "project-lightsaber/app/**"
      - "project-lightsaber/core/**"
      - "project-lightsaber/font-assets/**"
      - "project-lightsaber/*.gradle.kts"
      - "project-lightsaber/gradle/**"
      - "project-lightsaber/gradlew*"
      - "project-lightsaber/gradle.properties"
      - ".github/workflows/project-lightsaber-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: project-lightsaber-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  debug-apk:
    name: Build and publish debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK command line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install pinned Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Build debug APK
        working-directory: project-lightsaber
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Run host tests and package pinned SmthJedi font
        working-directory: project-lightsaber
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I core/include core/src/saber_engine.cpp core/tests/smooth_swing_trace.cpp -o "$RUNNER_TEMP/lightsaber-trace"
          "$RUNNER_TEMP/lightsaber-trace"
          g++ -std=c++17 -Wall -Wextra -Werror -I core/include core/src/saber_engine.cpp core/tests/audio_font_trace.cpp -o "$RUNNER_TEMP/lightsaber-audio-trace"
          "$RUNNER_TEMP/lightsaber-audio-trace"
          python3 font-assets/package_smthjedi.py --output "$RUNNER_TEMP/SmthJedi-ProffieOS.zip"
          mkdir -p "$RUNNER_TEMP/smthjedi-import-test"
          unzip -q "$RUNNER_TEMP/SmthJedi-ProffieOS.zip" -d "$RUNNER_TEMP/smthjedi-import-test"
          g++ -std=c++17 -Wall -Wextra -Werror -I core/include core/src/saber_engine.cpp core/tests/font_smoke.cpp -o "$RUNNER_TEMP/lightsaber-font-smoke"
          "$RUNNER_TEMP/lightsaber-font-smoke" "$RUNNER_TEMP/smthjedi-import-test/SmthJedi"

      - name: Verify APK contents and calculate checksum
        id: verify
        run: |
          apk="project-lightsaber/app/build/outputs/apk/debug/app-debug.apk"
          font_zip="$RUNNER_TEMP/SmthJedi-ProffieOS.zip"
          test -s "$apk"
          test -s "$font_zip"
          unzip -t "$apk"
          unzip -t "$font_zip"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -F "package: name='studios.spidey.lightsaber'"
          unzip -l "$apk" | grep -E 'lib/(arm64-v8a|x86_64)/liblightsaber\.so'
          sha256sum "$apk" "$font_zip" | tee "$RUNNER_TEMP/deliverables.sha256"
          cp "$apk" "$RUNNER_TEMP/Project-Lightsaber-debug.apk"
          echo "apk_sha256=$(sha256sum "$apk" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "font_sha256=$(sha256sum "$font_zip" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Upload APK and single-font ZIP to this workflow run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Project-Lightsaber-phone-test-assets
          path: |
            ${{ runner.temp }}/Project-Lightsaber-debug.apk
            ${{ runner.temp }}/SmthJedi-ProffieOS.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable APK release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_SHA256: ${{ steps.verify.outputs.apk_sha256 }}
          FONT_SHA256: ${{ steps.verify.outputs.font_sha256 }}
        run: |
          tag="lightsaber-${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          printf 'Debug APK built from %s\nAPK SHA-256: %s\n\nSmthJedi source: https://github.com/profezzorn/SoundFonts/tree/336d26ed7eb80e39e848c1cfd19ba86628944da5/SmthJedi\nFont ZIP SHA-256: %s\nThe ZIP contains only the 38 pinned SmthJedi files, including its original audio and license.\n' "$GITHUB_SHA" "$APK_SHA256" "$FONT_SHA256" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$tag" \
            "$RUNNER_TEMP/Project-Lightsaber-debug.apk#Project-Lightsaber-debug.apk" \
            "$RUNNER_TEMP/SmthJedi-ProffieOS.zip#SmthJedi-ProffieOS.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Project Lightsaber debug APK ${GITHUB_RUN_NUMBER}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          apk_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/Project-Lightsaber-debug.apk"
          font_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/SmthJedi-ProffieOS.zip"
          {
            echo "## Project Lightsaber phone test files"
            echo ""
            echo "APK: ${apk_url}"
            echo ""
            echo "APK SHA-256: \`${APK_SHA256}\`"
            echo ""
            echo "SmthJedi single-font ZIP: ${font_url}"
            echo ""
            echo "Font ZIP SHA-256: \`${FONT_SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"
