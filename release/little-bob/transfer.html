<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Bob · bring your saved home</title><style>body{background:#efe7d8;color:#294d4a;font:18px/1.6 system-ui,sans-serif;margin:0}main{max-width:620px;margin:auto;padding:32px 24px}button{background:#294d4a;color:white;border:0;border-radius:14px;padding:17px;font:inherit}a{color:#225e5c}#status{min-height:60px}</style><main><a href="./">Android installation</a><h1>Bring his saved home</h1><p>Use the same browser/profile where you played. This copies the existing local save; it does not change or erase the browser's home.</p><button id="export">Download saved home</button><p id="status" role="status"></p><p>Then long-press the installed Little Bob icon → Bring browser save → choose the downloaded JSON file.</p></main><script>
const keys=['byte-sunburn-home-v1','byte-sunburn-care-v1','byte-sunburn-crystals-v1','byte-sunburn-kitchen-v1','byte-sunburn-possessions-v1','byte-little-moments-v1','byte-backyard-xii-v1','byte-little-sun-sound','byte-was-here-v1'];
document.querySelector('#export').onclick=()=>{const status=document.querySelector('#status');try{const values={};for(const key of keys){const value=localStorage.getItem(key);if(value!==null)values[key]=value;}if(!values['byte-sunburn-home-v1']){status.textContent='No saved home found in this browser/profile. Open the game where you last played, then return here.';return;}const payload={format:'little-bob-save-v1',savedAt:new Date().toISOString(),values};const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='little-bob-saved-home.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);status.textContent='Saved home downloaded. Your browser save remains unchanged.';}catch(error){status.textContent='Browser storage was unavailable. Use the browser/profile where your game is saved.';}};
</script></html>
